services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      SOLANA_RPC_TIMEOUT_SECONDS: ${SOLANA_RPC_TIMEOUT_SECONDS:-20}
      DATABASE_PATH: /data/endpoint.db
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - endpoint-data:/data
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  endpoint-data:
